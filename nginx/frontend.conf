server {
    listen 80 default_server;
    server_name  _ ;
    root /acms/dist/intercom/;
    index index-ru.html;
    location / {
      try_files $uri $uri/ /index-ru.html;
    }
   location /ru/intercom {
      alias /acms/dist/intercom;
      index index-ru.html;
      try_files $uri $uri/ /index-ru.html;
  
   }
   location /en/intercom {
      alias /acms/dist/intercom;
      index index-en.html;
      try_files $uri $uri/ /index-en.html;

   }
   location ~* (.*admin/) {
      alias /acms/dist/admin;
      index index-ru.html;
      try_files $uri $uri/ /index-ru.html;

   }
   
}











