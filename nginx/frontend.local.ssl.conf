map $http_origin $domai_cors_origin {
    default "";
    "~^https://([a-z0-9-]+\.)*doma\.ai$" $http_origin;
}

map $domai_cors_origin $domai_cors_credentials {
    default "";
    "~.+" "true";
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/acms.crt;
    ssl_certificate_key /etc/nginx/ssl/acms.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    index index.html;
    root /acms/dist;

    add_header Access-Control-Allow-Origin $domai_cors_origin always;
    add_header Access-Control-Allow-Credentials $domai_cors_credentials always;
    add_header Vary Origin always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.doma.ai" always;

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $domai_cors_origin;
        add_header Access-Control-Allow-Credentials $domai_cors_credentials;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE, PATCH, HEAD";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Timestamp, X-BrandId, Accept-Language, X-Requested-With, DNT, User-Agent, If-Modified-Since, Cache-Control, Range";
        add_header Access-Control-Max-Age 86400;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    location /api/ {
       proxy_pass http://host.docker.internal:8080;
       proxy_http_version 1.1;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto https;
    }

    location = / {
      return 301 $scheme://$http_host/intercom-ru/;
    }
    location @adminru {
       root /acms/dist;
       try_files $uri $uri/ /admin-ru/index.html;
       add_header Cache-Control public;
    }
    location /admin-ru {
       alias /acms/dist/admin-ru;
       try_files $uri $uri/ @adminru;
    }
    location @adminen {
       root /acms/dist;
       try_files $uri $uri/ /admin-en/index.html;
       add_header Cache-Control public;
    }
    location /admin-en {
       alias /acms/dist/admin-en;
       try_files $uri $uri/ @adminen;
    }
    location @intercom-ru {
       root /acms/dist;
       try_files $uri $uri/ /intercom-ru/index.html;
       add_header Cache-Control public;
    }
    location /intercom-ru {
       alias /acms/dist/inercom-ru;
       try_files $uri $uri/ @intercom-ru;
       add_header Cache-Control public;
    }
    location @intercom-en {
       root /acms/dist;
       try_files $uri $uri/ /intercom-en/index.html;
       add_header Cache-Control public;
    }
    location /intercom-en {
       alias /acms/dist/inercom-en;
       try_files $uri $uri/ @intercom-en;
       add_header Cache-Control public;
    }
    location @intercom-ar {
       root /acms/dist;
       try_files $uri $uri/ /intercom-ar/index.html;
       add_header Cache-Control public;
    }
    location /intercom-ar {
       alias /acms/dist/inercom-ar;
       try_files $uri $uri/ @intercom-ar;
       add_header Cache-Control public;
    }
    location @courier {
       root /acms/dist;
       try_files $uri $uri/ /courier/index.html;
       add_header Cache-Control public;
    }
    location /courier {
       alias /acms/dist/courier;
       try_files $uri $uri/ @courier;
       add_header Cache-Control public;
    }
    location @lock {
       root /acms/dist;
       try_files $uri $uri/ /lock/index.html;
       add_header Cache-Control public;
    }
    location /lock {
       alias /acms/dist/lock;
       try_files $uri $uri/ @lock;
       add_header Cache-Control public;
    }
    location /ru/admin {
       return 301 /admin-ru;
    }
    location /ru {
       return 301 /intercom-ru;
    }
    location /en {
      return 301 /intercom-en;
    }
    location /ar {
      return 301 /intercom-ar;
    }
}