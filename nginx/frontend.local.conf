server {
    listen 80 default_server;
    server_name  _ ;
    index index.html;
    root /acms/dist;

    # Proxy API to backend on the host (same as npm start → localhost:5000)
    location /api/ {
       proxy_pass http://host.docker.internal:8080;
       proxy_http_version 1.1;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
      return 301 $scheme://$http_host/intercom-ru/;
    }
    location @adminru {
       root /acms/dist;
       try_files $uri $uri/ /admin-ru/index.html;
       add_header Cache-Control public;
    }
    location /admin-ru {
       alias /acms/dist/admin-ru;
       try_files $uri $uri/ @adminru;
    }
    location @adminen {
       root /acms/dist;
       try_files $uri $uri/ /admin-en/index.html;
       add_header Cache-Control public;
    }
    location /admin-en {
       alias /acms/dist/admin-en;
       try_files $uri $uri/ @adminen;
    }
    location @intercom-ru {
       root /acms/dist;
       try_files $uri $uri/ /intercom-ru/index.html;
       add_header Cache-Control public;
    }
    location /intercom-ru {
       alias /acms/dist/inercom-ru;
       try_files $uri $uri/ @intercom-ru;
       add_header Cache-Control public;
    }
    location @intercom-en {
       root /acms/dist;
       try_files $uri $uri/ /intercom-en/index.html;
       add_header Cache-Control public;
    }
    location /intercom-en {
       alias /acms/dist/inercom-en;
       try_files $uri $uri/ @intercom-en;
       add_header Cache-Control public;
    }
    location @intercom-ar {
       root /acms/dist;
       try_files $uri $uri/ /intercom-ar/index.html;
       add_header Cache-Control public;
    }
    location /intercom-ar {
       alias /acms/dist/inercom-ar;
       try_files $uri $uri/ @intercom-ar;
       add_header Cache-Control public;
    }
    location @courier {
       root /acms/dist;
       try_files $uri $uri/ /courier/index.html;
       add_header Cache-Control public;
    }
    location /courier {
       alias /acms/dist/courier;
       try_files $uri $uri/ @courier;
       add_header Cache-Control public;
    }
    location @lock {
       root /acms/dist;
       try_files $uri $uri/ /lock/index.html;
       add_header Cache-Control public;
    }
    location /lock {
       alias /acms/dist/lock;
       try_files $uri $uri/ @lock;
       add_header Cache-Control public;
    }
    location /ru/admin {
       return 301 /admin-ru;
    }
    location /ru {
       return 301 /intercom-ru;
    }
    location /en {
      return 301 /intercom-en;
    }
    location /ar {
      return 301 /intercom-ar;
    }
}
