version: "3.9"

services:

  acms:
    container_name: acms
    image: smartairkey/acmsuae:late
    restart: always
    networks:
      - dev-stage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`devacms.airkey.ae`)"
      - "traefik.http.routers.whoami.entrypoints=http"
    logging:
      driver: "elastic/elastic-logging-plugin:7.10.2"
      options:
        hosts: "http://172.31.1.70:9200"
        index: "acms-dev-ae-%{+yyyy.MM.dd}"

networks:
  test-stage:
    name: dev-stage
    driver: bridge