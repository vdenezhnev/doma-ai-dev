services:
  acms:
    container_name: acms-local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Relative API path — nginx proxies /api/ to host (see volumes below)
        API_HOST: /
        ONLINE_API_URL: https://online.smartairkey.com:4445
        APP_INTERCOM_TITLE: SmartAirkey
        APP_BRAND_ID: smartairkey
    ports:
      - "8082:8080"
    volumes:
      - ./nginx/frontend.local.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
