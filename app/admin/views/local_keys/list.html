<div class="row">
    <div class="col-lg-12">
        <h1 class="page-header" translate>LOCAL_KEYS_TITLE</h1>
    </div>
</div>

<div class="panel panel-default">
    <div class="panel-heading">
        <i class="fa fa-bar-chart-o fa-fw"></i> {{ 'LOCAL_KEYS_LIST' | translate }}
    </div>
    <!-- /.panel-heading -->
    <div class="panel-body">
        <div class="row">
            <div class="col-lg-12">
                <div>
                    <form>
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon"><i class="fa fa-search"></i></div>

                                <input type="text" class="form-control" placeholder="{{ 'LOCAL_KEYS_SEARCH_PLACEHOLDER' | translate }}" ng-model="q" ng-model-options="{debounce: 1000}">

                            </div>
                        </div>
                    </form>

                    <table class="table table-bordered table-hover table-striped">
                        <thead>
                            <tr>
                                <th style="vertical-align: top;" translate>TABLE_CELL_COMPANY</th>
                                <th style="vertical-align: top;" translate>TABLE_CELL_UUID</th>
                                <th style="width: 285px;">
                                    <div style="text-align: center;" translate>TABLE_CELL_DATE</div>
                                    <div style="display: flex;">
                                        <div class="form-inline">
                                            <span class="dropdown">
                                                <a class="dropdown-toggle" id="keyDate-from" role="button" data-toggle="dropdown" data-target="#" href="#">
                                                    <input class="form-control datetime-field"
                                                           placeholder="{{ 'COMPONENT_DATETIME_FROM' | translate }}"
                                                           readonly
                                                           style="width: 100%;"
                                                           value="{{ listFilter.keyDate.from | date:'dd-MM-yyyy' }}"/>
                                                </a>
                                                <ul class="dropdown-menu" role="menu">
                                                    <datetimepicker ng-model="listFilter.keyDate.from"
                                                                    ng-model-options="{debounce: 500}"
                                                                    datetimepicker-config="{dropdownSelector: '#keyDate-from', startView:'day', minView:'day' }" />
                                                </ul>
                                            </span>
                                        </div>
                                        <div class="form-inline">
                                            <span class="dropdown">
                                                <a class="dropdown-toggle" id="keyDate-to" role="button" data-toggle="dropdown" data-target="#" href="#">
                                                    <input class="form-control datetime-field"
                                                           placeholder="{{ 'COMPONENT_DATETIME_TO' | translate }}"
                                                           readonly
                                                           style="width: 100%;"
                                                           value="{{ listFilter.keyDate.to | date:'dd-MM-yyyy' }}"/>
                                                </a>
                                                <ul class="dropdown-menu" role="menu">
                                                    <datetimepicker ng-model="listFilter.keyDate.to"
                                                                    ng-model-options="{debounce: 500}"
                                                                    datetimepicker-config="{dropdownSelector: '#keyDate-to', startView:'day', minView:'day' }" />
                                                </ul>
                                            </span>
                                        </div>
                                        <button class="btn btn-default" ng-click="resetFilter()" translate>BUTTON_RESET</button>
                                    </div>
                                </th>
                                <th style="vertical-align: top; width: 200px;" translate>TABLE_CELL_USER_PHONE_NUMBER</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="key in keys">
                                <td>{{ payment.serviceCompany }}</td>
                                <td>{{ payment.id }}</td>
                                <td>{{ payment.createDate | date:'dd-MM-yyyy' }}</td>
                                <td>{{ payment.phoneNumber }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <button ng-click="loadKeys(20, false, listFilter)" ng-hide="loadedAllKeys" class="btn btn-default" translate>
                    BUTTON_LOAD_MORE
                </button>
            </div>
        </div>
    </div>
</div>
