
<div class="container">
    <div class="row">
        <div class="col-md-4 col-md-offset-4">
            <div class="login-panel panel panel-default">
                <div class="panel-heading">
                    <h3 class="panel-title" translate>LOGIN_AUTH</h3>
                </div>
                <div class="panel-body">
                    <form role="form" name="LoginForm" ng-submit="submit()">
                        <fieldset>
                            <div class="form-group">
                                <input class="form-control" placeholder="{{ 'LOGIN_LOGIN' | translate }}" ng-model="login">
                            </div>
                            <div class="form-group">
                                <input class="form-control" placeholder="{{ 'LOGIN_PASSWORD' | translate }}" type="password" ng-model="password">
                            </div>
                            <button type="submit" class="btn btn-lg btn-success btn-block" translate>LOGIN_BUTTON_LOGIN</button>
                        </fieldset>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
