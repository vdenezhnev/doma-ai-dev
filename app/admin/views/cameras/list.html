<div class="row">
  <div class="col-lg-12">
    <h1 class="page-header" translate>CAMERAS_TITLE</h1>
  </div>
</div>

<div class="panel panel-default">
  <div class="panel-body">
    <div class="row">
      <div class="col-lg-12">
        <div>
          <table class="table table-bordered table-hover table-striped">
            <thead>
            <tr>
              <th style="vertical-align: top;" translate>TABLE_CELL_UUID</th>
              <th style="vertical-align: top;" translate>TABLE_CELL_CAMERA_NAME</th>
              <th style="vertical-align: top;" translate>TABLE_CELL_CAMERA_COMPANY_NAME</th>
              <th style="vertical-align: top;" translate>TABLE_CELL_CAMERA_IP</th>
              <th style="vertical-align: top;" translate>TABLE_CELL_CAMERA_STATUS</th>
            </tr>
            </thead>
            <tbody>
            <tr ng-repeat="camera in cameras">
              <td>{{ camera.id }}</td>
              <td>{{ camera.name }}</td>
              <td>{{ camera.serviceCompanyName }}</td>
              <td>{{ camera.link }}</td>
              <td translate>{{ camera.online ? "Online"  : "Offline"}}</td>
            </tr>
            </tbody>
          </table>
        </div>

        <button ng-click="loadCameras(20, false, listFilter)" ng-hide="loadedAllCameras" class="btn btn-default" translate>
          BUTTON_LOAD_MORE
        </button>
      </div>
    </div>
  </div>
</div>
