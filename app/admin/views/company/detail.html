
<div class="row" ng-if="company">

    <div class="col-lg-12">
        <h1 class="page-header">{{ company.companyName }}</h1>
    </div>

    <div class="col-lg-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <i class="fa fa-edit"></i> Редактирование компании
            </div>

            <div class="panel-body">
                <div class="row">
                    <form class="form" ng-submit="save()">

                        <ng-include src="'app/admin/views/company/form.html'"></ng-include>

                        <div class="col-lg-12">
                            <hr>
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                        </div>
                    </form>
                    <!-- /.col-lg-8 (nested) -->
                </div>
                <!-- /.row -->
            </div>
            <!-- /.panel-body -->

        </div>
    </div>

</div>
