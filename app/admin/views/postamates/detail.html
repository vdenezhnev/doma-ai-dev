
<div class="row" ng-if="postamat">

    <div class="col-lg-12">
        <h1 class="page-header">{{ postamat.id }}</h1>
    </div>

    <div class="col-lg-12 mb15">
        <a class="btn btn-default btn-danger" ng-click="delete()"><i class="fa fa-trash"></i> {{ 'BUTTON_POSTAMAT_DELETE' | translate }}</a>
    </div>

    <div class="col-lg-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <i class="fa fa-edit"></i> {{ 'POSTAMAT_EDIT' | translate }}
            </div>

            <div class="panel-body">
                <div class="row">
                    <form class="form" ng-submit="save()">

                        <ng-include src="'app/admin/views/postamates/form.html'"></ng-include>

                        <div class="col-lg-12">
                            <hr>
                            <button type="submit" class="btn btn-primary" translate>BUTTON_SAVE</button>
                        </div>
                    </form>
                    <!-- /.col-lg-8 (nested) -->
                </div>
                <!-- /.row -->
            </div>
            <!-- /.panel-body -->

        </div>
    </div>

</div>
