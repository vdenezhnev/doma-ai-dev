
<div class="row" ng-if="lock">

    <div class="col-lg-12">
        <h1 class="page-header">{{ lock.id }}</h1>
    </div>

    <div class="col-lg-12 mb15">
        <a ui-sref="admin.lock.detail({id: lock.id})" class="btn btn-default"><i class="fa fa-arrow-left"></i> {{ 'BUTTON_BACK' | translate }}</a>
    </div>

    <div class="col-lg-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <i class="fa fa-edit"></i> {{ 'BUTTON_LOCK_REPLACEMENT' | translate }}
            </div>

            <div class="panel-body">
                <div class="row">
                    <form class="form" ng-submit="replace(newLockId)">

                        <div class="col-lg-6">
                            <div class="form-group">
                                <label translate>LOCKS_FORM_REPLACEMENT_ID</label>
                                <input class="form-control" disabled="disabled" ng-model="lock.id">
                            </div>

                            <div class="form-group">
                                <label translate>LOCKS_FORM_REPLACEMENT_NEW_ID</label>
                                <input class="form-control" ng-model="newLockId">
                            </div>

                        </div>

                        <div class="col-lg-12">
                            <hr>
                            <button type="submit" class="btn btn-primary" translate>BUTTON_SAVE</button>
                        </div>
                    </form>
                    <!-- /.col-lg-8 (nested) -->
                </div>
                <!-- /.row -->
            </div>
            <!-- /.panel-body -->

        </div>
    </div>

</div>
