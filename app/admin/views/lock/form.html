<div class="col-lg-6">

    <div class="form-group" ng-if="!isNew">
        <label>ID</label>
        <input class="form-control" ng-disabled="true" ng-model="lock.id">
    </div>

    <div class="form-group" ng-if="isNew">
        <label>ID</label>
        <input class="form-control" ng-model="lock.lockId">
    </div>

    <hr>

    <div class="checkbox" ng-repeat="(name, gesture) in lock.connectivity.gestures">
        <label>
            <input type="checkbox" ng-model="gesture"> {{ name }}
        </label>
    </div>

    <hr>

    <div class="form-group">
        <label>Дистанция</label>
        <input class="form-control" ng-model="lock.connectivity.onMoving.activeDistance">
    </div>

    <div class="form-group">
        <label>Время открытия</label>
        <input class="form-control" ng-model="lock.connectivity.activeTime">
    </div>

    <div class="checkbox">
        <label>
            <input type="checkbox" ng-model="lock.connectivity.onMoving.autoOpen"> Автооткрытие
        </label>
    </div>

    <div class="checkbox">
        <label>
            <input type="checkbox" ng-model="lock.connectivity.onMoving.autoClose"> Автозакрытие
        </label>
    </div>
</div>

<div class="col-lg-6">

    <div ng-repeat="transport in lock.connectivity.transports">

        <div ng-if="transport.type == 'wiFiDirect'">
            <h3>WifiDirect</h3>

            <div class="form-group">
                <label>MAC-адрес</label>
                <input class="form-control" ng-model="transport.macAddress">
            </div>
        </div>

        <div ng-if="transport.type == 'blueTooth'">
            <h3>Bluetooth</h3>

            <div class="form-group">
                <label>Имя устройства</label>
                <input class="form-control" ng-model="transport.deviceName">
            </div>

            <div class="form-group">
                <label>MAC-адрес</label>
                <input class="form-control" ng-model="transport.macAddress">
            </div>

            <div class="form-group">
                <label>Secure Uuid</label>
                <input class="form-control" ng-model="transport.secureUuid">
            </div>

            <div class="form-group">
                <label>Insecure Uuid</label>
                <input class="form-control" ng-model="transport.insecureUuid">
            </div>
        </div>

        <div ng-if="transport.type == 'blueToothLe'">
            <h3>BLE</h3>

            <div class="form-group">
                <label>Имя устройства</label>
                <input class="form-control" ng-model="transport.deviceName">
            </div>

            <div class="form-group">
                <label>MAC-адрес</label>
                <input class="form-control" ng-model="transport.macAddress">
            </div>

            <div class="form-group">
                <label>Service Uuid</label>
                <input class="form-control" ng-model="transport.serviceUuid">
            </div>

            <div class="form-group">
                <label>CharData Uuid</label>
                <input class="form-control" ng-model="transport.charDataUuid">
            </div>

            <div class="form-group">
                <label>CharRssi Uuid</label>
                <input class="form-control" ng-model="transport.charRssiUuid">
            </div>
        </div>

        <div ng-show="transport.type == 'gsm' && filter.gsmActive">
            <h3><label><input type="checkbox" ng-model="filter.gsmActive" /> GSM</label></h3>

            <div class="form-group" ng-show="filter.gsmActive">
                <label>Номер телефона контроллера</label>
                <input class="form-control" ng-model="transport.phoneNumber" mask="{mask: '+9{*}'}">
            </div>
        </div>

    </div>

    <div ng-if="!filter.gsmActive">
        <h3><label><input type="checkbox" ng-model="filter.gsmActive" /> GSM</label></h3>
    </div>

</div>
