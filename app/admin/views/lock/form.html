<div class="col-lg-6">

    <div class="form-group" ng-if="!isNew">
        <label>ID</label>
        <input class="form-control" ng-disabled="true" ng-model="lock.id">
    </div>

    <div class="form-group" ng-if="isNew">
        <label>ID</label>
        <input class="form-control" ng-model="lock.lockId">
    </div>

    <hr>

    <div class="checkbox" ng-repeat="(name, gesture) in lock.connectivity.gestures">
        <label>
            <input type="checkbox" ng-model="gesture"> {{ name }}
        </label>
    </div>

    <hr>

    <div class="form-group">
        <label>Дистанция</label>
        <input class="form-control" ng-model="lock.connectivity.onMoving.activeDistance">
    </div>

    <div class="form-group">
        <label>Время открытия</label>
        <input class="form-control" ng-model="lock.connectivity.activeTime">
    </div>

    <div class="checkbox">
        <label>
            <input type="checkbox" ng-model="lock.connectivity.onMoving.autoOpen"> Автооткрытие
        </label>
    </div>

    <div class="checkbox">
        <label>
            <input type="checkbox" ng-model="lock.connectivity.onMoving.autoClose"> Автозакрытие
        </label>
    </div>
</div>

<div class="col-lg-6">

    <div ng-repeat="transport in lock.connectivity.transports">

        <!-- BLE -->
        <div class="panel panel-default" ng-if="transport.type == 'blueToothLe'">
            <div class="panel-heading">
                <h3 style="margin: 0;"><input type="checkbox" ng-model="transport.isActivated" /> BLE</h3>
            </div>
            <div class="panel-body">
                <div class="form-group">
                    <label>Имя устройства</label>
                    <input class="form-control" ng-model="transport.deviceName">
                </div>
                <div class="form-group">
                    <label>MAC-адрес</label>
                    <input class="form-control" ng-model="transport.macAddress">
                </div>
                <div class="form-group">
                    <label>Service Uuid</label>
                    <input class="form-control" ng-model="transport.serviceUuid">
                </div>
                <div class="form-group">
                    <label>CharData Uuid</label>
                    <input class="form-control" ng-model="transport.charDataUuid">
                </div>
                <div class="form-group">
                    <label>CharRssi Uuid</label>
                    <input class="form-control" ng-model="transport.charRssiUuid">
                </div>
            </div>
        </div>

        <!-- NFC -->
        <div class="panel panel-default" ng-if="transport.type == 'nfc'">
            <div class="panel-heading">
                <h3 style="margin: 0;"><input type="checkbox" ng-model="transport.isActivated" /> NFC</h3>
            </div>
        </div>

        <!-- GSM -->
        <div class="panel panel-default" ng-if="transport.type == 'gsm'">
            <div class="panel-heading">
                <h3 style="margin: 0;"><input type="checkbox" ng-model="transport.isActivated" /> GSM</h3>
            </div>
            <div class="panel-body">
                <div class="form-group">
                    <input type="checkbox" ng-model="transport.isIntegratedSimCard" /> Встроенная сим-карта
                </div>
                <div class="form-group">
                    <label>Номер телефона контроллера</label>
                    <input class="form-control" ng-model="transport.phoneNumber" mask="{mask: '+9{*}'}">
                </div>
            </div>
        </div>

        <!-- Internet -->
        <div class="panel panel-default" ng-if="transport.type == 'internet'">
            <div class="panel-heading">
                <h3 style="margin: 0;"><input type="checkbox" ng-model="transport.isActivated" /> Internet</h3>
            </div>
            <div class="panel-body">
                <div class="form-group">
                    <label>Url</label>
                    <input class="form-control" ng-model="transport.url">
                </div>
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <input type="checkbox" ng-model="transport.geoRestriction" /> Ограничение по геопозиции
                    </div>
                    <div class="panel-body">
                        <div class="form-group">
                            <label>Радиус</label>
                            <input type="number" class="form-control" ng-model="transport.radius" ng-disabled="!transport.geoRestriction" ng-required="transport.geoRestriction">
                        </div>
                        <div class="form-group" style="display: flex;">
                            <div style="width: 50%; padding-right: 5px;">
                                <label>Широта</label>
                                <input class="form-control" ng-model="transport.coordinate.x" ng-disabled="!transport.geoRestriction" ng-required="transport.geoRestriction">
                            </div>
                            <div style="width: 50%;">
                                <label>Долгота</label>
                                <input class="form-control" ng-model="transport.coordinate.y" ng-disabled="!transport.geoRestriction" ng-required="transport.geoRestriction">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- WiFi direct -->
        <div class="panel panel-default" ng-if="transport.type == 'wiFiDirect'">
            <div class="panel-heading">
                <h3 style="margin: 0;"><input type="checkbox" ng-model="transport.isActivated" /> WifiDirect</h3>
            </div>
            <div class="panel-body">
                <div class="form-group">
                    <label>MAC-адрес</label>
                    <input class="form-control" ng-model="transport.macAddress">
                </div>
            </div>
        </div>

        <!-- Bluetooth -->
        <div class="panel panel-default" ng-if="transport.type == 'blueTooth'">
            <div class="panel-heading">
                <h3 style="margin: 0;"><input type="checkbox" ng-model="transport.isActivated" /> Bluetooth</h3>
            </div>
            <div class="panel-body">
                <div class="form-group">
                    <label>Имя устройства</label>
                    <input class="form-control" ng-model="transport.deviceName">
                </div>
                <div class="form-group">
                    <label>MAC-адрес</label>
                    <input class="form-control" ng-model="transport.macAddress">
                </div>
                <div class="form-group">
                    <label>Secure Uuid</label>
                    <input class="form-control" ng-model="transport.secureUuid">
                </div>
                <div class="form-group">
                    <label>Insecure Uuid</label>
                    <input class="form-control" ng-model="transport.insecureUuid">
                </div>
            </div>
        </div>

    </div>

</div>
