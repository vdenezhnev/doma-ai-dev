

<div style="text-align: center;" class="text-xs-center lock-main">

  <div class="col-md-12">
    <div class="h3"><span translate>INFO</span></div>

  </div>

  <div class="d-flex justify-content-center">
    <div class="lock-state"
         ng-repeat="lock in locks">
      <button
              style="width: 60%;"
              ​
              ng-click="onOpenLock(lock.LockID)"
              ng-disabled="!isAvailable(lock)"
              ng-class="{'btn btn-success': lock.LockOpen, 'btn btn-primary': !lock.LockOpen}">
        <span translate>OPEN</span> <b>{{ lock.LockID }}</b>
        <div class="loader" ng-class="{'hidden': lock.isLoaded}"><span></span></div>
      </button>
    </div>
  </div>
</div>
