

<div style="text-align: center;" class="text-xs-center">

  <div class="col-md-12">
    <div class="h3"><span translate>INFO</span></div>

  </div>

  <div class="d-flex justify-content-center">
    <button
      class="btn btn-primary"
      style="width: 60%; margin-bottom: 20px;"
      ng-repeat="lock in locks"
      ng-click="onOpenLock(lock.LockID)"
      ng-disabled="!isAvailable(lock)">
      <span translate>OPEN</span> <b>{{ lock.LockID }}</b>
    </button>
  </div>
</div>
