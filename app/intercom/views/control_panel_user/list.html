
<h1 class="page-title uppercase" translate>html.control_panel_user.list_title</h1>

<div class="row">
    <div class="col-md-12">

        <a ui-sref="admin.control_panel_user.create" class="btn default uppercase" translate>
            html.defaults.add_title</a>

        <div class="table-scrollable" ng-if="users.$resolved">
            <table class="table table-hover table-tr-hover">
                <thead>
                    <tr>
                        <th translate>html.control_panel_user.list.login</th>
                        <th translate>html.control_panel_user.list.displayName</th>
                        <th translate>html.control_panel_user.list.accessPointDisplayNames</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="user in users"
                        ui-sref="admin.control_panel_user.detail({id: user.id, user: user})">
                        <td>{{ user.login }}</td>
                        <td>{{ user.displayName }}</td>
                        <td>
                            <div ng-repeat="name in user.accessPointDisplayNames">{{ name }}</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
