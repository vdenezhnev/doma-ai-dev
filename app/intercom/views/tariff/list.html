
<h1 class="page-title uppercase" translate>html.tariff.list_title</h1>

<div class="row">
    <div class="col-md-12">

        <a ui-sref="admin.tariff.create" class="btn default uppercase" translate>html.tariff.add_title</a>

        <div class="table-scrollable" ng-show="tariffs.length > 0 && tariffs.$resolved">
            <table class="table table-hover table-tr-hover">
                <thead>
                    <tr>
                        <th translate>html.tariff.tariff_display</th>
                        <th translate>html.tariff.price_month_display</th>
                        <th translate>html.tariff.price_year_display</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="tariff in tariffs" ui-sref="admin.tariff.detail({id: tariff.id, revision: tariff.revision})">
                        <td>{{ tariff.displayName }}</td>
                        <td>{{ tariff.monthlyTariff.price.value }} {{ currency }}</td>
                        <td>{{ tariff.yearlyTariff.price.value }} {{ currency }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
