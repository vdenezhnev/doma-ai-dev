
<div class="form-body">
    <div class="form-group">
        <label translate>html.access.perimeter.form.display_name</label>
        <input class="form-control" type="text" name="displayName" ng-model="perimeter.displayName" validator="required">
    </div>

    <div class="form-group">
        <label translate>html.access.perimeter.form.description</label>
        <input class="form-control" name="includedKeys" ng-model="perimeter.description">
    </div>

    <div style="margin-bottom: 15px">
        <a ng-click="openQrModalWindow()" class="btn default" translate>html.access.perimeter.form.generateQR</a>
    </div>

    <div ng-if="perimeter.id">
        <div class="form-group">
            <label>
                <input type="checkbox" ng-disabled="!isRootPerimeter" ng-model="perimeter.restrictPassPermanentKeys">
                <span translate>html.access.perimeter.restrictPassPermanentKeys</span>
            </label>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" ng-disabled="!isRootPerimeter" ng-model="perimeter.restrictPassTemporaryKeys">
                <span translate>html.access.perimeter.restrictPassTemporaryKeys</span>
            </label>
        </div>
    </div>
</div>
