
<form name="AccessPerimeterForm">
    <div class="portlet without-title light bordered">

        <div class="portlet-title" style="display: flex; gap: 8px; align-items: center">
            <div class="block-caption">
                <i class="fa fa-cogs"></i>
                <span translate>html.access.perimeter.add_title</span>
            </div>
            <span class="labelinfo_icon">
                    <div class="labelinfo_i">i</div>
                    <div class="labelinfo_text" translate>
                        Раздел «Добавить периметр» позволяет создать новую папку и указать название для нее<br/>
                        Сгенерировать QR-код – создает файл с QR-кодами
                    </div>
                </span>
        </div>

        <div class="portlet-body form">
            <ng-include src="'app/intercom/views/access/perimeter/form.html'"></ng-include>

            <div class="form-actions">
                <button type="submit" class="btn blue" validation-submit="AccessPerimeterForm" ng-click="submit()" translate>html.defaults.add_title</button>
                <a ui-sref="admin.access" class="btn default" translate>html.defaults.cancel_title</a>
            </div>
        </div>
    </div>
</form>
