
<h1 class="page-title uppercase" translate>html.roles.roles</h1>

<div class="row">
    <div class="col-md-12">

        <div class="abonent-toolbar">
            <a ui-sref="admin.roles.create" class="btn default uppercase" translate>html.roles.addRole</a>
        </div>

        <div class="table-scrollable">
            <table class="table table-hover table-bordered table-tr-hover" ng-class="{'rtl-text': isRTL}">
                <thead>
                    <tr>
                        <th width="300px" translate>html.roles.roleName</th>
                        <th translate>html.roles.roleComment</th>
                        <th width="200px" translate>html.roles.roleChangeDate</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="role in roles"
                        ui-sref="admin.roles.detail({id: role.id, role: role})">
                        <td>{{ role.name }}</td>
                        <td>{{ role.comment }}</td>
                        <td>{{ role.modified | date:'dd.MM.yyyy' }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
