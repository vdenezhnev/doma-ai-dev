<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>authenticatedUser</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      margin: 24px;
      line-height: 1.4;
    }

    button {
      padding: 8px 14px;
      cursor: pointer;
    }

    #status {
      margin: 12px 0;
      color: CanvasText;
      opacity: 0.8;
    }

    #status.error {
      color: #c0392b;
      opacity: 1;
    }

    pre {
      padding: 16px;
      overflow: auto;
      border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, CanvasText 4%, Canvas);
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>authenticatedUser</h1>
  <p>
    Запрос с GitHub Pages идёт через CORS-прокси, потому что
    <code>condo.d.doma.ai</code> не отдаёт
    <code>Access-Control-Allow-Origin</code> для этого сайта.
    Cookie сессии API при этом не передаются.
  </p>
  <button id="fetchBtn" type="button">Запросить</button>
  <div id="status">Нажмите кнопку, чтобы отправить POST-запрос.</div>
  <pre id="output"></pre>

  <script>
    const API_URL = "https://condo.d.doma.ai/admin/api";
    const PROXY_URL = "https://corsproxy.io/?url=" + encodeURIComponent(API_URL);
    const BODY = {
      operationName: "authenticatedUser",
      variables: {},
      query: `query authenticatedUser {
  authenticatedUser {
    id
    name
    avatar {
      publicUrl
      __typename
    }
    phone
    email
    isAdmin
    isSupport
    rightsSet {
      id
      __typename
    }
    type
    locale
    showGlobalHints
    hasMarketingConsent
    isEmailVerified
    isPhoneVerified
    isTwoFactorAuthenticationEnabled
    __typename
  }
}`,
    };

    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");
    const fetchBtn = document.getElementById("fetchBtn");

    async function fetchAuthenticatedUser() {
      statusEl.classList.remove("error");
      statusEl.textContent = "Отправка запроса…";
      outputEl.textContent = "";
      fetchBtn.disabled = true;

      try {
        const response = await fetch(PROXY_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json",
          },
          body: JSON.stringify(BODY),
        });

        const text = await response.text();
        let pretty = text;

        try {
          pretty = JSON.stringify(JSON.parse(text), null, 2);
        } catch {
          // leave as raw text if response is not JSON
        }

        outputEl.textContent = pretty;
        statusEl.textContent = `HTTP ${response.status} ${response.statusText}`;

        if (!response.ok) {
          statusEl.classList.add("error");
        }
      } catch (error) {
        statusEl.classList.add("error");
        statusEl.textContent = "Ошибка запроса";
        outputEl.textContent = error instanceof Error ? error.message : String(error);
      } finally {
        fetchBtn.disabled = false;
      }
    }

    fetchBtn.addEventListener("click", fetchAuthenticatedUser);
    fetchAuthenticatedUser();
  </script>
</body>
</html>
