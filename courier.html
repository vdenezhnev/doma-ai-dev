<!DOCTYPE html>
<html lang="en" ng-app="app">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Панель курьера</title>

    <link rel="shortcut icon" href="icon.png">

    <!-- Bootstrap -->
    <link href="https://fonts.googleapis.com/css?family=PT+Sans:400,700" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:700,300,800,400&subset=latin,cyrillic" rel="stylesheet" type="text/css">

    <!-- inject:css -->
    <!-- build:css styles/vendor.css -->
    <link href="/components/angular-notify/dist/angular-notify.min.css" rel="stylesheet">
    <link href="/components/angular-loading-bar/build/loading-bar.min.css" rel="stylesheet" media="all" />
    <link href="/components/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/components/font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css">
    <!-- endbuild -->
    <!-- build:css styles/bundle.css -->
    <link href="/css/courier.css" rel="stylesheet" type="text/css">
    <!-- endbuild -->
    <!-- endinject -->

    <base href="<ENV::BASE_HREF>">

    <script>
        window.__language = '<ENV::LANGUAGE_CODE>';
        window.__api_host = '<ENV::API_HOST>';
        window.__api_url = '<ENV::API_URL_COURIER>';
    </script>
</head>
<body ng-controller="AppCtrl">

    <div ui-view></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>

    <!-- vendor:js -->
    <!-- build:js scripts/vendor.js -->
    <script src="/components/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="/components/lodash/lodash.js"></script>

    <script src="/components/string-format/string-format.js"></script>
    <script src="/components/angular/angular.js"></script>
    <script src="/components/angular-ui-router/release/angular-ui-router.js"></script>
    <script src="/components/ngstorage/ngStorage.js"></script>
    <script src="/components/angular-notify/dist/angular-notify.js"></script>
    <script src="/components/angular-loading-bar/build/loading-bar.js"></script>
    <script src="/components/angular-animate/angular-animate.js"></script>
    <script src="/components/angular-modal-service/dst/angular-modal-service.min.js"></script>

    <!-- endbuild -->
    <!-- endinject -->

    <!-- bundle:js -->
    <!-- build:js scripts/bundle.js -->
    <script src="/app/courier/app.js"></script>
    <script src="/app/courier/config/route.js"></script>
    <script src="/app/courier/config/settings.js"></script>

    <script src="/app/courier/i18n/locale-ru.js"></script>
    <script src="/app/courier/i18n/locale-en.js"></script>
    <script src="/app/courier/i18n/locale-ar.js"></script>

    <script src="/app/courier/directives/translate.js"></script>

    <script src="/app/courier/controllers/AppControllers.js"></script>
    <script src="/app/courier/controllers/PanelControllers.js"></script>
    <!-- endbuild -->
    <!-- endinject -->

    <!-- {% include "inc/yandex_metrika.html" %} -->
</body>
</html>
